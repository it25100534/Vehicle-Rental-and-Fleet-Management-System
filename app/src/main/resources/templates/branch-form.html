<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Branch Details | DriveEase</title><link rel="stylesheet" href="/css/admin.css"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"></head><body>
<div th:replace="~{fragments/admin-sidebar :: sidebar}"></div><main class="main-content"><div class="page-header"><h2 th:text="${branch==null?'Add Branch':'Edit Branch'}"></h2><p>Branch IDs use the format BR-001.</p></div><div class="form-card"><form action="/admin/branches/save" method="post" enctype="multipart/form-data"><div class="form-group"><label class="form-label" for="branchId">Branch ID</label><input class="form-control" id="branchId" name="branchId" pattern="BR-[0-9]{3}" th:value="${branch?.branchId}" th:readonly="${branch!=null}" required></div><div class="form-group"><label class="form-label" for="name">Name</label><input class="form-control" id="name" name="name" minlength="2" maxlength="60" th:value="${branch?.name}" required></div><div class="form-group"><label class="form-label" for="address">Address</label><input class="form-control" id="address" name="address" minlength="5" maxlength="120" th:value="${branch?.address}" required></div><div class="form-group"><label class="form-label" for="phone">Phone</label><input class="form-control" id="phone" name="phone" pattern="0[0-9]{9}" th:value="${branch?.phone}" required></div><div class="form-group"><label class="form-label" for="image">Branch photo</label><input class="form-control" type="file" id="image" name="image" accept="image/jpeg,image/png"><p>JPEG or PNG, up to 5 MB. Leave empty to keep the current photo.</p><img id="branchPhotoPreview" th:src="${branch?.imagePath}" th:hidden="${branch?.imagePath == null}" alt="Branch photo preview" style="max-width:100%;width:340px;height:210px;object-fit:cover;border-radius:12px"></div><div class="form-actions"><a class="btn btn-secondary" href="/admin/branches">Cancel</a><button class="btn btn-primary" type="submit">Save Branch</button></div></form></div></main><script src="/js/branch-photo-preview.js" defer></script></body></html>
