spring.application.name=Vehicle-Rental-Service-Platform

# Local database profile. It uses a real file-backed SQL database in MySQL compatibility mode.
# Activate the mysql profile for the final MySQL server.
spring.datasource.url=jdbc:h2:file:./data/driveease;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql

# Session and error-page safety
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=7MB
