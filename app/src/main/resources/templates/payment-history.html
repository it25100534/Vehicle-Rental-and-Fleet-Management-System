<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment History | DriveEase</title><link rel="stylesheet" href="/css/catalog.css"><style>.history-main{max-width:1250px;margin:0 auto;padding:55px 28px 90px}.history-main h1{font-size:3rem;margin-bottom:8px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:28px 0}.card{background:#f4f4f5;border-radius:18px;padding:22px}.card small{color:#6d7380;font-weight:700}.card strong{display:block;font-size:1.45rem;margin-top:8px}.table-wrap{border:1px solid #e0e1e5;border-radius:18px;overflow:auto}.history-table{width:100%;border-collapse:collapse}.history-table th,.history-table td{padding:17px;text-align:left;border-bottom:1px solid #e9e9ec}.history-table th{background:#f3f3f4;font-size:.8rem;text-transform:uppercase}.receipt{color:#111;font-weight:800}.empty{padding:45px;text-align:center}@media(max-width:750px){.summary{grid-template-columns:1fr}.history-main h1{font-size:2.2rem}}</style><link rel="stylesheet" href="/css/shared-chrome.css"><script src="/js/shared-chrome.js" defer></script></head><body class="catalog-body"><div th:replace="~{fragments/customer-header :: header('payments')}"></div><main class="history-main"><p>My account</p><h1>Payment history</h1><p>Payments, refunds, and safe invoice receipts for <strong th:text="${customerName}"></strong>.</p><div class="summary"><div class="card"><small>Invoices</small><strong th:text="${invoices.size()}"></strong></div><div class="card"><small>Paid amount</small><strong th:text="${'Rs. ' + #numbers.formatDecimal(paidTotal,1,2)}"></strong></div><div class="card"><small>Refunded</small><strong th:text="${'Rs. ' + #numbers.formatDecimal(refundTotal,1,2)}"></strong></div></div><div class="table-wrap"><div class="empty" th:if="${invoices.isEmpty()}">No payment records yet.</div><table class="history-table" th:unless="${invoices.isEmpty()}"><thead><tr><th>Invoice</th><th>Vehicle</th><th>Date</th><th>Payment</th><th>Status</th><th>Net total</th><th>Receipt</th></tr></thead><tbody><tr th:each="invoice : ${invoices}"><td th:text="${'#' + invoice.id}"></td><td th:text="${invoice.vehicleName}"></td><td th:text="${(invoice.paidAt ?: invoice.createdAt) == null ? 'Not recorded' : #temporals.format((invoice.paidAt ?: invoice.createdAt), 'dd MMM yyyy, hh:mm a')}"></td><td th:text="${billingService.getSafePaymentLabel(invoice)}"></td><td th:text="${invoice.status}"></td><td th:text="${'Rs. ' + #numbers.formatDecimal(invoice.totalAmount,1,2)}"></td><td><a class="receipt" th:href="@{/invoices/{id}(id=${invoice.id})}">View</a></td></tr></tbody></table></div></main><div th:replace="~{fragments/customer-footer :: footer}"></div></body></html>
