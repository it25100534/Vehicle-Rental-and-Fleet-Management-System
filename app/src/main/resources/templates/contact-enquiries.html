<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact Enquiries | DriveEase</title><link rel="stylesheet" href="/css/admin.css"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"><style>.enquiry-table-wrap{overflow-x:auto}.enquiry-table{width:100%;min-width:760px;table-layout:fixed}.enquiry-table th:nth-child(1){width:16%}.enquiry-table th:nth-child(2){width:22%}.enquiry-table th:nth-child(3){width:16%}.enquiry-table th:nth-child(4){width:28%}.enquiry-table th:nth-child(5){width:10%}.enquiry-table th:nth-child(6){width:8%}.enquiry-table td{vertical-align:top;overflow-wrap:anywhere}.enquiry-message{white-space:pre-wrap}.enquiry-email{font-size:13px;color:var(--text-secondary)}.enquiry-status{display:inline-block;padding:5px 9px;border-radius:20px;background:#ffffff12;font-size:12px}.enquiry-table .btn{padding:7px 10px;font-size:12px}.main-content{min-height:100vh}</style></head><body><div th:replace="~{fragments/admin-sidebar :: sidebar}"></div><main class="main-content"><div class="page-header"><h2>Contact enquiries</h2><p>Review customer messages and mark completed enquiries as resolved.</p></div><div class="table-card enquiry-table-wrap"><table class="premium-table enquiry-table"><thead><tr><th>Received</th><th>Customer</th><th>Subject</th><th>Message</th><th>Status</th><th>Action</th></tr></thead><tbody><tr th:if="${#lists.isEmpty(enquiries)}"><td colspan="6" class="empty-table-cell"><span class="material-symbols-outlined">inbox</span>No enquiries yet. New customer messages will appear here.</td></tr><tr th:each="e:${enquiries}"><td th:text="${e.created_at}"></td><td><strong th:text="${e.name}"></strong><br><span class="enquiry-email" th:text="${e.email}"></span></td><td th:text="${e.subject}"></td><td class="enquiry-message" th:text="${e.message}"></td><td><span class="enquiry-status" th:text="${e.status}"></span></td><td><form th:if="${e.status!='RESOLVED'}" th:action="@{/admin/contact-enquiries/{id}/resolve(id=${e.enquiry_id})}" method="post"><button class="btn btn-primary">Resolve</button></form><span th:if="${e.status=='RESOLVED'}">—</span></td></tr></tbody></table></div></main></body></html>
