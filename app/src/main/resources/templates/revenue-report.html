<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revenue Report | DriveEase</title><link rel="stylesheet" href="/css/admin.css"><style>.report-main{margin-left:var(--admin-sidebar-width);width:calc(100% - var(--admin-sidebar-width));padding:28px clamp(20px,3vw,48px) 56px;max-width:none}.filters,.report-card{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:18px;padding:22px;margin-bottom:20px}.filters{display:flex;align-items:end;gap:14px}.filters label{color:var(--text-secondary);font-weight:700}.filters input{display:block;margin-top:7px;padding:11px;border-radius:8px;border:1px solid var(--border-subtle);background:#111019;color:white}.button{padding:12px 18px;border:0;border-radius:9px;background:#2f6dc1;color:white;font-weight:800;text-decoration:none}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:17px;margin:22px 0}.metric{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:16px;padding:20px}.metric small{color:var(--text-secondary)}.metric strong{display:block;font-size:1.35rem;margin-top:9px}.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}.report-table{width:100%;border-collapse:collapse}.report-table th,.report-table td{padding:12px;border-bottom:1px solid var(--border-subtle);text-align:left}@media(max-width:900px){.report-main{width:100%;margin-left:0;padding:22px 16px 44px}.summary,.split{grid-template-columns:1fr}.filters{align-items:stretch;flex-direction:column}}</style></head><body><div th:replace="~{fragments/admin-sidebar :: sidebar}"></div><main class="report-main"><h1>Revenue and refund report</h1><p>Recognized revenue excludes void invoices and subtracts recorded refunds.</p><form class="filters" method="get" action="/admin/reports"><label>Start date<input type="date" name="start" th:value="${start}" required></label><label>End date<input type="date" name="end" th:value="${end}" required></label><button class="button" type="submit">Run report</button><a class="button" href="/admin-report" style="background:#343141">Invoices</a></form><section class="summary"><div class="metric"><small>Invoices</small><strong th:text="${invoices.size()}"></strong></div><div class="metric"><small>Gross billed</small><strong th:text="${'Rs. ' + #numbers.formatDecimal(grossTotal,1,2)}"></strong></div><div class="metric"><small>Refunds</small><strong th:text="${'Rs. ' + #numbers.formatDecimal(refundTotal,1,2)}"></strong></div><div class="metric"><small>Recognized revenue</small><strong th:text="${'Rs. ' + #numbers.formatDecimal(netRevenue,1,2)}"></strong></div></section><div class="split"><section class="report-card"><h2>Revenue by branch</h2><table class="report-table"><tr><th>Branch</th><th>Revenue</th></tr><tr th:each="entry : ${byBranch}"><td th:text="${entry.key}"></td><td th:text="${'Rs. ' + #numbers.formatDecimal(entry.value,1,2)}"></td></tr></table></section><section class="report-card"><h2>Invoice status</h2><table class="report-table"><tr><th>Status</th><th>Count</th></tr><tr th:each="entry : ${byStatus}"><td th:text="${entry.key}"></td><td th:text="${entry.value}"></td></tr></table></section></div><section class="report-card"><h2>Included invoices</h2><table class="report-table"><tr><th>ID</th><th>Customer</th><th>Branch</th><th>Status</th><th>Revenue</th><th></th></tr><tr th:each="invoice : ${invoices}"><td th:text="${invoice.id}"></td><td th:text="${invoice.customerName}"></td><td th:text="${invoice.branchId ?: 'Legacy'}"></td><td th:text="${invoice.status}"></td><td th:text="${'Rs. ' + #numbers.formatDecimal(invoice.recognizedRevenue,1,2)}"></td><td><a th:href="@{/admin/invoices/{id}(id=${invoice.id})}">View</a></td></tr></table></section></main></body></html>
