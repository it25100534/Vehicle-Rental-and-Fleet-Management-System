<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vehicle History | DriveEase</title><link rel="stylesheet" href="/css/admin.css"></head><body><div th:replace="~{fragments/admin-sidebar :: sidebar}"></div><main class="main-content"><div class="page-header"><h2 th:text="${'Vehicle history · '+vehicle.vehicleId}"></h2><p th:text="${vehicle.make+' '+vehicle.model+' — bookings, service and condition inspections in one timeline.'}"></p></div><div class="table-container"><table class="inventory-table"><thead><tr><th>Date</th><th>Type</th><th>Reference</th><th>Status</th><th>Details</th></tr></thead><tbody><tr th:each="e:${events}"><td th:text="${e.event_date}"></td><td th:text="${e.event_type}"></td><td th:text="${e.title}"></td><td th:text="${e.status}"></td><td th:text="${e.details}"></td></tr><tr th:if="${events.empty}"><td colspan="5">No recorded events for this vehicle.</td></tr></tbody></table></div></main></body></html>
