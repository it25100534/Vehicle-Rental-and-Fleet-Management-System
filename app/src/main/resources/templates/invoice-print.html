<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>DriveEase Invoice</title><style>body{font-family:Arial,sans-serif;color:#171719;margin:0;background:#eee}.sheet{max-width:780px;margin:35px auto;background:white;padding:48px;box-shadow:0 5px 25px #bbb}.top{display:flex;justify-content:space-between;border-bottom:3px solid #111;padding-bottom:20px}.muted{color:#666}.info{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:25px 0}.info div{padding:12px;background:#f5f5f6}.amounts{width:100%;border-collapse:collapse}.amounts td{padding:11px;border-bottom:1px solid #ddd}.amounts td:last-child{text-align:right}.total{font-size:1.3rem;font-weight:bold}.print{display:block;margin:20px auto;padding:12px 24px;background:#111;color:white;border:0;border-radius:8px}@media print{body{background:white}.sheet{box-shadow:none;margin:0;max-width:none}.print{display:none}}</style><link rel="stylesheet" href="/css/shared-chrome.css"><script src="/js/shared-chrome.js" defer></script></head><body><div th:replace="~{fragments/customer-header :: header('')}"></div><button class="print" onclick="window.print()">Print / Save as PDF</button><main class="sheet"><div class="top"><div><h1>DriveEase</h1><p class="muted">Vehicle Rental Receipt</p></div><div><h2 th:text="'Invoice #' + ${invoice.id}"></h2><strong th:text="${invoice.status}"></strong></div></div><section class="info"><div><small>Customer</small><br><strong th:text="${invoice.customerName}"></strong></div><div><small>Vehicle</small><br><strong th:text="${invoice.vehicleName + ' · ' + invoice.vehicleId}"></strong></div><div><small>Branch</small><br><strong th:text="${invoice.branchId ?: 'Legacy record'}"></strong></div><div><small>Payment</small><br><strong th:text="${paymentLabel}"></strong></div><div><small>Booking</small><br><strong th:text="${invoice.transactionId ?: 'Not linked'}"></strong></div><div><small>Paid at</small><br><strong th:text="${invoice.paidAt ?: 'Pending'}"></strong></div></section><table class="amounts"><tr><td>Rental subtotal</td><td th:text="${'Rs. ' + #numbers.formatDecimal(invoice.subtotal,1,2)}"></td></tr><tr><td>Discount</td><td th:text="${'- Rs. ' + #numbers.formatDecimal(invoice.discount,1,2)}"></td></tr><tr><td>Additional charges and deposit</td><td th:text="${'Rs. ' + #numbers.formatDecimal(invoice.lateFee + invoice.damageFee + invoice.fuelCharge + invoice.mileageCharge + invoice.alternateDropoffCharge + invoice.depositAmount,1,2)}"></td></tr><tr><td>Refund</td><td th:text="${'- Rs. ' + #numbers.formatDecimal(invoice.refundAmount,1,2)}"></td></tr><tr class="total"><td>Net total</td><td th:text="${'Rs. ' + #numbers.formatDecimal(invoice.totalAmount,1,2)}"></td></tr></table><p class="muted">This receipt contains only a masked payment reference. Sensitive card details are never displayed.</p></main><div th:replace="~{fragments/customer-footer :: footer}"></div></body></html>
