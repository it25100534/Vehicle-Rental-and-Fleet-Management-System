<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Invoice | DriveEase</title><link rel="stylesheet" href="/css/admin.css"><style>.form-page{margin-left:var(--admin-sidebar-width);width:calc(100% - var(--admin-sidebar-width));padding:28px clamp(20px,3vw,48px) 56px;max-width:none}.panel{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:18px;padding:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.grid label{font-weight:700;color:var(--text-secondary)}.grid input{display:block;width:100%;box-sizing:border-box;margin-top:8px;padding:13px;border-radius:9px;border:1px solid var(--border-subtle);background:#111019;color:white}.actions{margin-top:24px;display:flex;gap:12px}.btn-link{padding:12px 18px;border-radius:9px;text-decoration:none;border:0;font-weight:800;background:#2f6dc1;color:white}.secondary{background:#2a2736;color:white}@media(max-width:800px){.form-page{width:100%;margin-left:0;padding:22px 16px 44px}.grid{grid-template-columns:1fr}}</style></head><body><div th:replace="~{fragments/admin-sidebar :: sidebar}"></div><main class="form-page"><h1 th:text="'Edit invoice #' + ${invoice.id}"></h1><p>Customer, vehicle, rental duration, payment identity, and lifecycle status are locked for audit safety.</p><form class="panel" th:action="@{/admin/invoices/{id}/edit(id=${invoice.id})}" method="post"><div class="grid"><label>Discount<input name="discount" type="number" min="0" step="0.01" th:value="${invoice.discount}" required></label><label>Late fee<input name="lateFee" type="number" min="0" step="0.01" th:value="${invoice.lateFee}" required></label><label>Damage fee<input name="damageFee" type="number" min="0" step="0.01" th:value="${invoice.damageFee}" required></label><label>Fuel charge<input name="fuelCharge" type="number" min="0" step="0.01" th:value="${invoice.fuelCharge}" required></label><label>Mileage charge<input name="mileageCharge" type="number" min="0" step="0.01" th:value="${invoice.mileageCharge}" required></label><label>Alternate drop-off charge<input name="alternateDropoffCharge" type="number" min="0" step="0.01" th:value="${invoice.alternateDropoffCharge}" required></label><label>Deposit<input name="depositAmount" type="number" min="0" step="0.01" th:value="${invoice.depositAmount}" required></label></div><div class="actions"><button class="btn-link" type="submit">Save audited update</button><a class="btn-link secondary" th:href="@{/admin/invoices/{id}(id=${invoice.id})}">Cancel</a></div></form></main></body></html>
