<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | DriveEase</title>
    <link rel="stylesheet" th:href="@{/css/catalog.css}">
    <style>
        .reset-main{min-height:75vh;display:grid;place-items:center;padding:48px 20px;background:#f7f7f7}
        .reset-card{width:min(620px,100%);background:white;border:1px solid #ddd;border-radius:24px;padding:36px}
        .reset-card h1{font-size:2.2rem;margin:0 0 8px}.reset-card p{color:#5d6470}
        .reset-form{display:grid;gap:18px;margin-top:28px}.reset-form label{font-weight:700;display:block;margin-bottom:7px}
        .reset-form input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #bbb;border-radius:10px;font:inherit}
        .reset-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.reset-alert{padding:12px;border-radius:9px;background:#fee4e2;color:#912018}
        .reset-actions{display:flex;align-items:center;gap:18px}.reset-actions button{border:0;border-radius:10px;padding:14px 24px;background:#171717;color:white;font-weight:800;cursor:pointer}
        .reset-actions a{color:#171717;font-weight:700}@media(max-width:600px){.reset-grid{grid-template-columns:1fr}}
    </style>
<link rel="stylesheet" href="/css/shared-chrome.css"><script src="/js/shared-chrome.js" defer></script></head>
<body>
<div th:replace="~{fragments/customer-header :: header('')}"></div>
<main class="reset-main">
    <section class="reset-card">
        <h1>Reset your password</h1>
        <p>Confirm the username, email, and licence ID registered with your account.</p>
        <div class="reset-alert" th:if="${error}" th:text="${error}"></div>
        <form class="reset-form" action="/forgot-password" method="post">
            <div class="reset-grid">
                <div><label for="username">Username</label><input id="username" name="username" minlength="3" maxlength="30" required></div>
                <div><label for="licenseId">Licence ID</label><input id="licenseId" name="licenseId" minlength="4" maxlength="25" required></div>
            </div>
            <div><label for="email">Email address</label><input id="email" name="email" type="email" maxlength="120" required></div>
            <div class="reset-grid">
                <div><label for="newPassword">New password</label><input id="newPassword" name="newPassword" type="password" minlength="6" maxlength="64" required></div>
                <div><label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" minlength="6" maxlength="64" required></div>
            </div>
            <div class="reset-actions"><button type="submit">Reset Password</button><a href="/login">Back to sign in</a></div>
        </form>
    </section>
</main>
<div th:replace="~{fragments/customer-footer :: footer}"></div>
</body>
</html>
