spring.datasource.url=jdbc:h2:mem:driveease_home_tests;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:home-test-fixtures.sql
spring.sql.init.continue-on-error=false
spring.jpa.hibernate.ddl-auto=none
driveease.home.apply-fleet-map=false
driveease.branch-images-directory=./target/test-branch-images
