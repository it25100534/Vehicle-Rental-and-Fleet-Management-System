<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar" class="sidebar" aria-label="Admin navigation">
  <svg aria-hidden="true" width="0" height="0" style="position:absolute;overflow:hidden">
    <symbol id="adm-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="adm-car" viewBox="0 0 24 24"><path d="M5 17h14l1-6-2-4H6l-2 4 1 6Z"/><path d="M5 12h14M7 17v2m10-2v2M7 14h2m6 0h2"/></symbol>
    <symbol id="adm-pin" viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="adm-tag" viewBox="0 0 24 24"><path d="M3 11V4h7l11 11-6 6L3 11Z"/><circle cx="7.5" cy="7.5" r="1"/></symbol>
    <symbol id="adm-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2H3Zm14-15a3 3 0 0 1 0 6m1 3a5 5 0 0 1 3 5v1h-4"/></symbol>
    <symbol id="adm-wrench" viewBox="0 0 24 24"><path d="M14 5a5 5 0 0 0-6 6L3 16l5 5 5-5a5 5 0 0 0 6-6l-4 3-4-4 3-4Z"/></symbol>
    <symbol id="adm-key" viewBox="0 0 24 24"><circle cx="8" cy="9" r="5"/><path d="m12 12 9 9m-4-4 2-2"/></symbol>
    <symbol id="adm-card" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20m-16 5h5"/></symbol>
    <symbol id="adm-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-7M3 4v5h5m4-2v5l4 2"/></symbol>
    <symbol id="adm-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18m-13 4h3m-3 3h6"/></symbol>
    <symbol id="adm-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 9h18c0-1-3-2-3-9Zm-8 12h4"/></symbol>
    <symbol id="adm-message" viewBox="0 0 24 24"><path d="M4 4h16v13H9l-5 4V4Z"/><path d="M8 9h8m-8 4h6"/></symbol>
    <symbol id="adm-exit" viewBox="0 0 24 24"><path d="M10 4H4v16h6m3-4 4-4-4-4m4 4H8"/></symbol>
  </svg>
  <div class="sidebar-header"><div class="sidebar-brand">DriveEase</div><div class="sidebar-user"><div class="avatar"><img alt="" src="/images/manager.png"></div><div class="user-info"><div class="name">Admin</div><div class="role">Fleet Manager</div></div></div></div>
  <nav class="sidebar-nav" aria-label="Admin sections">
    <a class="nav-link" href="/admin/dashboard"><svg class="nav-icon"><use href="#adm-grid"/></svg><span>Dashboard</span></a>
    <a class="nav-link" href="/inventory"><svg class="nav-icon"><use href="#adm-car"/></svg><span>Inventory</span></a>
    <a class="nav-link" href="/admin/branches"><svg class="nav-icon"><use href="#adm-pin"/></svg><span>Branches</span></a>
    <a class="nav-link" href="/admin/vehicle-categories"><svg class="nav-icon"><use href="#adm-tag"/></svg><span>Categories</span></a>
    <a class="nav-link" href="/admin/registration"><svg class="nav-icon"><use href="#adm-users"/></svg><span>Staff</span></a>
    <a class="nav-link" href="/maintenance"><svg class="nav-icon"><use href="#adm-wrench"/></svg><span>Maintenance</span></a>
    <a class="nav-link" href="/handover"><svg class="nav-icon"><use href="#adm-key"/></svg><span>Handover &amp; Return</span></a>
    <a class="nav-link" href="/admin-report"><svg class="nav-icon"><use href="#adm-card"/></svg><span>Billing</span></a>
    <a class="nav-link" href="/admin/activity-log"><svg class="nav-icon"><use href="#adm-history"/></svg><span>Activity Logs</span></a>
    <a class="nav-link" href="/admin/customers"><svg class="nav-icon"><use href="#adm-users"/></svg><span>Customers</span></a>
    <a class="nav-link" href="/admin/bookings"><svg class="nav-icon"><use href="#adm-calendar"/></svg><span>Bookings</span></a>
    <a class="nav-link" href="/notifications"><svg class="nav-icon"><use href="#adm-bell"/></svg><span>Notifications</span><span id="admin-pending-count" aria-label="Pending customer requests" style="display:none;margin-left:auto;padding:2px 7px;border-radius:999px;background:#2867c9;color:#fff;font-size:.72rem;font-weight:700"></span></a>
    <a class="nav-link" href="/admin/contact-enquiries"><svg class="nav-icon"><use href="#adm-message"/></svg><span>Enquiries</span></a>
    <div class="sidebar-logout"><form action="/admin-logout" method="post"><button type="submit" class="nav-link"><svg class="nav-icon"><use href="#adm-exit"/></svg><span>Logout</span></button></form></div>
  </nav>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const currentPath = window.location.pathname;
      const section = currentPath.startsWith('/admin/invoices') || currentPath.startsWith('/admin/reports')
        ? '/admin-report' : currentPath.startsWith('/admin/vehicles/') || currentPath === '/vehicleForm'
        ? '/inventory' : currentPath.startsWith('/admin/edit') ? '/admin/registration' : currentPath;
      document.querySelectorAll(".sidebar-nav a.nav-link").forEach(link => {
        const href = link.getAttribute("href");
        if (section === href || (href && section.startsWith(href + "/"))) {
          link.classList.add("active");
          link.setAttribute("aria-current", "page");
        }
      });
    });
    (() => {
      const badge = document.getElementById("admin-pending-count");
      if (!badge) return;
      const refresh = () => fetch("/api/admin/notifications/pending-count", {credentials:"same-origin", cache:"no-store"})
        .then(response => response.ok ? response.json() : null)
        .then(data => {
          if (!data) return;
          badge.textContent = data.count > 99 ? "99+" : String(data.count);
          badge.style.display = data.count > 0 ? "inline-block" : "none";
        }).catch(() => {});
      refresh();
      setInterval(refresh, 15000);
    })();
  </script>
</aside>
</body>
</html>
