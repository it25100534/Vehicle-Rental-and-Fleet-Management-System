spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vehicle_rental_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql

# This local MySQL profile is used for the requested demonstration scenario.
# Set DRIVEEASE_DEMO_SEED=false to start it without the 200/500/1000 fixture.
driveease.demo.seed=${DRIVEEASE_DEMO_SEED:true}
